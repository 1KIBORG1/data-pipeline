<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 265" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .header { fill: #f0f6fc; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-size: 11px; }
      .mono-raw { fill: #ff7b72; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .mono-clean { fill: #7ee787; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .mono-rule { fill: #d2a8ff; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .arrow { stroke: #8b949e; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="265"/>

  <text x="28" y="34" fill="#f0f6fc" font-size="15" font-weight="600">Data Normalization &amp; Quality Transformation</text>
  <text x="952" y="34" fill="#8b949e" font-size="12" text-anchor="end">Raw Next.js JSON  →  Domain Rules  →  Typed PostgreSQL Row</text>
  <line x1="28" y1="46" x2="952" y2="46" stroke="#21262d" stroke-width="1"/>

  <!-- Left Box: Raw JSON -->
  <rect class="panel" x="28" y="64" width="280" height="176" stroke="#f85149"/>
  <text class="header" x="44" y="88">Raw RSC Payload (Unstructured)</text>
  <line x1="44" y1="98" x2="292" y2="98" stroke="#21262d"/>
  <text class="mono-raw" x="44" y="118">"title": "Predaj 1,5-izb. byt s loggiou"</text>
  <text class="mono-raw" x="44" y="138">"subValue": "THREE_ROOM_APARTMENT"</text>
  <text class="mono-raw" x="44" y="158">"priceNum": 207500, "area": "44 m²"</text>
  <text class="mono-raw" x="44" y="178">"floor": "Prízemie", "numberOfFloors": 1</text>
  <text class="mono-raw" x="44" y="198">"district": "okres Bratislava - III"</text>
  <text class="mono-raw" x="44" y="218">"hasBalcony": false</text>

  <!-- Arrow 1 -->
  <line class="arrow" x1="308" y1="152" x2="342" y2="152" marker-end="url(#arrow2)"/>

  <!-- Middle Box: Validation Engine -->
  <rect class="panel" x="346" y="64" width="288" height="176" stroke="#d29922"/>
  <text class="header" x="362" y="88">ApartmentModel Validation Rules</text>
  <line x1="362" y1="98" x2="618" y2="98" stroke="#21262d"/>
  <text class="mono-rule" x="362" y="118">1. Reject reserved / sold / wanted stems</text>
  <text class="mono-rule" x="362" y="138">2. Room priority: Title &gt; Subcat &gt; Attr</text>
  <text class="mono-rule" x="362" y="158">3. Sale bounds: 15k–5M €, 300–25k €/m²</text>
  <text class="mono-rule" x="362" y="178">4. Floor map &amp; drop total_floors &lt;= 1</text>
  <text class="mono-rule" x="362" y="198">5. Strip "okres " &amp; normalize hyphens</text>
  <text class="mono-rule" x="362" y="218">6. Recover balcony flag from title text</text>

  <!-- Arrow 2 -->
  <line class="arrow" x1="634" y1="152" x2="668" y2="152" marker-end="url(#arrow2)"/>

  <!-- Right Box: Clean Record -->
  <rect class="panel" x="672" y="64" width="280" height="176" stroke="#3fb950"/>
  <text class="header" x="688" y="88">Clean PostgreSQL Row (Typed)</text>
  <line x1="688" y1="98" x2="936" y2="98" stroke="#21262d"/>
  <text class="mono-clean" x="688" y="118">rooms_count:       1        (SMALLINT)</text>
  <text class="mono-clean" x="688" y="138">price_eur:         207500   (INTEGER)</text>
  <text class="mono-clean" x="688" y="158">area_sqm:          44.00    (NUMERIC)</text>
  <text class="mono-clean" x="688" y="178">price_per_sqm_eur: 4715.91  (NUMERIC)</text>
  <text class="mono-clean" x="688" y="198">floor: 0, total_floors: NULL</text>
  <text class="mono-clean" x="688" y="218">district: "Bratislava-III", balcony: true</text>
</svg>
