<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 315" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .header { fill: #f0f6fc; font-size: 13px; font-weight: 600; }
      .mono-raw { fill: #ff7b72; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .mono-clean { fill: #7ee787; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .mono-rule { fill: #d2a8ff; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .arrow { stroke: #8b949e; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="bg" width="1040" height="315"/>

  <text x="28" y="34" fill="#f0f6fc" font-size="15.5" font-weight="600">Bronze to Silver Normalization</text>
  <text x="1012" y="34" fill="#8b949e" font-size="12" text-anchor="end">Raw RSC JSONB → Domain Rules → Typed Silver Row</text>
  <line x1="28" y1="46" x2="1012" y2="46" stroke="#21262d" stroke-width="1"/>

  <rect class="panel" x="28" y="64" width="302" height="224" stroke="#f85149"/>
  <text class="header" x="44" y="88">Bronze Payload (raw_listings.payload)</text>
  <line x1="44" y1="98" x2="314" y2="98" stroke="#21262d"/>
  <text class="mono-raw" x="44" y="120">"title": "2-izb. byt s loggiou, Vrakuňa"</text>
  <text class="mono-raw" x="44" y="142">"desc": "36,10 m² + 3,45 m² loggia"</text>
  <text class="mono-raw" x="44" y="164">"area": "40", "priceNum": 84900</text>
  <text class="mono-raw" x="44" y="186">"unitPrice": "2 146,65 €/m²"</text>
  <text class="mono-raw" x="44" y="208">"floor": "1. NP (Prízemie)", "tot": 10</text>
  <text class="mono-raw" x="44" y="230">"hasElevator": "$undefined"</text>
  <text class="mono-raw" x="44" y="252">"district": "okres Bratislava II"</text>
  <text class="mono-raw" x="44" y="274">"construction": "Panelová", GPS: SK</text>

  <line class="arrow" x1="330" y1="176" x2="362" y2="176" marker-end="url(#arrow2)"/>

  <rect class="panel" x="366" y="64" width="314" height="224" stroke="#d29922"/>
  <text class="header" x="382" y="88">Domain Rules (src/domain/* + Pydantic)</text>
  <line x1="382" y1="98" x2="664" y2="98" stroke="#21262d"/>
  <text class="mono-rule" x="382" y="120">1. Slovakia GPS box, /mes. &amp; entity check</text>
  <text class="mono-rule" x="382" y="142">2. Section split (isolate LOKALITA)</text>
  <text class="mono-rule" x="382" y="164">3. Exact area: 84900 / 2146.65 = 39.55</text>
  <text class="mono-rule" x="382" y="186">4. Interior area: 39.55 - 3.45 = 36.10 m²</text>
  <text class="mono-rule" x="382" y="208">5. 0-based floor (Prízemie / 1. NP → 0)</text>
  <text class="mono-rule" x="382" y="230">6. Strict $undefined check + elev rules</text>
  <text class="mono-rule" x="382" y="252">7. 3-valued balcony (True / False / NULL)</text>
  <text class="mono-rule" x="382" y="274">8. Panelová guard + strip "okres " prefix</text>

  <line class="arrow" x1="680" y1="176" x2="712" y2="176" marker-end="url(#arrow2)"/>

  <rect class="panel" x="716" y="64" width="296" height="224" stroke="#3fb950"/>
  <text class="header" x="732" y="88">Silver Row (apartments, 18 cols)</text>
  <line x1="732" y1="98" x2="996" y2="98" stroke="#21262d"/>
  <text class="mono-clean" x="732" y="120">rooms_count:       2        (SMALLINT)</text>
  <text class="mono-clean" x="732" y="142">price_eur:         84900    (INTEGER)</text>
  <text class="mono-clean" x="732" y="164">area_sqm:          36.10    (NUMERIC)</text>
  <text class="mono-clean" x="732" y="186">price_per_sqm_eur: 2351.80  (NUMERIC)</text>
  <text class="mono-clean" x="732" y="208">floor: 0, total_floors: 10  (SMALLINT)</text>
  <text class="mono-clean" x="732" y="230">has_elevator:      TRUE     (BOOLEAN)</text>
  <text class="mono-clean" x="732" y="252">has_balcony:       TRUE     (3-VALUED)</text>
  <text class="mono-clean" x="732" y="274">district: "Bratislava II"   (VARCHAR)</text>
</svg>
