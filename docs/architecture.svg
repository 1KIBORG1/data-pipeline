<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 355" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .card-extract { stroke: #58a6ff; }
      .card-bronze { stroke: #d29922; }
      .card-silver { stroke: #a371f7; }
      .card-gold { stroke: #3fb950; }
      .step-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .title { fill: #f0f6fc; font-size: 14px; font-weight: 600; }
      .module { fill: #8b949e; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .desc { fill: #c9d1d9; font-size: 11.5px; }
      .code-pill { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 4px; }
      .code-text { fill: #79c0ff; font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pill-bronze { fill: #e3b341; }
      .pill-silver { fill: #d2a8ff; }
      .pill-gold { fill: #7ee787; }
      .arrow { stroke: #8b949e; stroke-width: 1.8; fill: none; }
      .arrow-feedback { stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
      .arrow-offline { stroke: #a371f7; stroke-width: 1.4; stroke-dasharray: 4,3; fill: none; }
      .feedback-label { fill: #58a6ff; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .offline-label { fill: #d2a8ff; font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a371f7"/>
    </marker>
  </defs>

  <rect class="bg" width="1040" height="355"/>

  <text x="28" y="34" fill="#f0f6fc" font-size="15.5" font-weight="600">Nehnutelnosti.sk ELT Pipeline Architecture</text>
  <text x="1012" y="34" fill="#8b949e" font-size="12" text-anchor="end">Scrapy • Next.js RSC • Pydantic v2 • PostgreSQL 17</text>
  <line x1="28" y1="46" x2="1012" y2="46" stroke="#21262d" stroke-width="1"/>

  <rect class="card card-extract" x="28" y="66" width="222" height="192"/>
  <text class="step-badge" x="44" y="90" fill="#58a6ff">1. EXTRACT &amp; UNPACK</text>
  <text class="title" x="44" y="110">Sitemap + RSC Flight</text>
  <text class="module" x="44" y="127">spider.py • rsc_extractor.py</text>
  <line x1="44" y1="138" x2="234" y2="138" stroke="#21262d"/>
  <text class="desc" x="44" y="158">• Incremental XML &lt;lastmod&gt;</text>
  <text class="desc" x="44" y="177">• Unpacks Next.js Flight ($ref)</text>
  <text class="desc" x="44" y="196">• JSON-LD fallback &amp; isActive</text>
  <text class="desc" x="44" y="215">• Retry cooldown middleware</text>
  <rect class="code-pill" x="44" y="226" width="190" height="22"/>
  <text class="code-text" x="139" y="241" text-anchor="middle">extract_ad_with_status()</text>

  <line class="arrow" x1="250" y1="162" x2="278" y2="162" marker-end="url(#arrow)"/>

  <rect class="card card-bronze" x="282" y="66" width="222" height="192"/>
  <text class="step-badge" x="298" y="90" fill="#d29922">2. BRONZE LAYER</text>
  <text class="title" x="298" y="110">Raw JSONB Storage</text>
  <text class="module" x="298" y="127">pipelines.py • db.py</text>
  <line x1="298" y1="138" x2="488" y2="138" stroke="#21262d"/>
  <text class="desc" x="298" y="158">• Strips media/POI arrays</text>
  <text class="desc" x="298" y="177">• Batched execute_values (100)</text>
  <text class="desc" x="298" y="196">• Auto-reconnect on idle drop</text>
  <text class="desc" x="298" y="215">• Deactivates missing listings</text>
  <rect class="code-pill" x="298" y="226" width="190" height="22"/>
  <text class="code-text pill-bronze" x="393" y="241" text-anchor="middle">raw_listings (JSONB)</text>

  <line class="arrow" x1="504" y1="162" x2="532" y2="162" marker-end="url(#arrow)"/>

  <rect class="card card-silver" x="536" y="66" width="222" height="192"/>
  <text class="step-badge" x="552" y="90" fill="#a371f7">3. SILVER LAYER</text>
  <text class="title" x="552" y="110">Validation &amp; Cleaning</text>
  <text class="module" x="552" y="127">transform.py • domain/*</text>
  <line x1="552" y1="138" x2="742" y2="138" stroke="#21262d"/>
  <text class="desc" x="552" y="158">• Keyset replay from Bronze</text>
  <text class="desc" x="552" y="177">• GPS box, sections, area math</text>
  <text class="desc" x="552" y="196">• 3-valued balcony &amp; 0-floor</text>
  <text class="desc" x="552" y="215">• Prunes delisted/invalid rows</text>
  <rect class="code-pill" x="552" y="226" width="190" height="22"/>
  <text class="code-text pill-silver" x="647" y="241" text-anchor="middle">apartments (18 cols)</text>

  <line class="arrow" x1="758" y1="162" x2="786" y2="162" marker-end="url(#arrow)"/>

  <rect class="card card-gold" x="790" y="66" width="222" height="192"/>
  <text class="step-badge" x="806" y="90" fill="#3fb950">4. GOLD VIEWS &amp; CHECKS</text>
  <text class="title" x="806" y="110">SQL Views &amp; Invariants</text>
  <text class="module" x="806" y="127">views.sql • quality_check.py</text>
  <line x1="806" y1="138" x2="996" y2="138" stroke="#21262d"/>
  <text class="desc" x="806" y="158">• Deduplicates agency clones</text>
  <text class="desc" x="806" y="177">• District median price / m²</text>
  <text class="desc" x="806" y="196">• 6 SQL invariant checks</text>
  <text class="desc" x="806" y="215">• Column completeness report</text>
  <rect class="code-pill" x="806" y="226" width="190" height="22"/>
  <text class="code-text pill-gold" x="901" y="241" text-anchor="middle">v_apartments_deduplicated</text>

  <path class="arrow-offline" d="M 435 258 L 435 288 L 647 288 L 647 262" marker-end="url(#arrow-purple)"/>
  <rect x="448" y="276" width="186" height="20" fill="#0d1117"/>
  <text class="offline-label" x="541" y="290" text-anchor="middle">python -m src.transform</text>

  <path class="arrow-feedback" d="M 350 258 L 350 326 L 139 326 L 139 262" marker-end="url(#arrow-blue)"/>
  <rect x="64" y="314" width="380" height="22" fill="#0d1117"/>
  <text class="feedback-label" x="254" y="329" text-anchor="middle">open_spider(): preload Bronze timestamps (incl. rejected IDs)</text>
</svg>
