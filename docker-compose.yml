services:
  db:
    image: postgres:17
    container_name: nehnutelnosti_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nehnutelnosti}
      POSTGRES_USER: ${DB_USER:-scraper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scraper} -d ${DB_NAME:-nehnutelnosti}"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    container_name: nehnutelnosti_scraper
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432

volumes:
  pgdata: