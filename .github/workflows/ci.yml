name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nehnutelnosti_test
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U scraper -d nehnutelnosti_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type-check with mypy
        run: mypy src

      - name: Run unit and PostgreSQL 17 integration tests
        env:
          RUN_PG_INTEGRATION_TESTS: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: nehnutelnosti_test
          DB_USER: scraper
          DB_PASSWORD: test_password
          DB_SSLMODE: disable
        run: pytest
